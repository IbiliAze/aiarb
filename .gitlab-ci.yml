# Lint, type-check and test every push and merge request. A `v*` tag also
# publishes the package to this project's PyPI registry, once the checks pass.

stages:
  - check
  - publish

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache
  # The tests make git repos, which need someone to commit as.
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.com

.uv:
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --locked

lint:
  extends: .uv
  stage: check
  script:
    - uv run ruff check
    - uv run ruff format --check
    - uv run mypy

test:
  extends: .uv
  stage: check
  image: ghcr.io/astral-sh/uv:python$PYTHON_VERSION-bookworm
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - uv run pytest

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    # The tag must name the version being published.
    - test "v$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)" = "$CI_COMMIT_TAG"
    - uv build
    # --check-url skips files the registry already has, so a re-run is harmless.
    # It carries the token itself: uv sends the publish credentials only with uploads.
    - >
      uv publish
      --publish-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi"
      --check-url "https://gitlab-ci-token:$CI_JOB_TOKEN@${CI_SERVER_HOST}/api/v4/projects/$CI_PROJECT_ID/packages/pypi/simple"
      --username gitlab-ci-token
      --password "$CI_JOB_TOKEN"
