[project]
name = "aiarb"
version = "0.0.1"
description = "An AI architecture review board for your codebase."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ibi Hasanli" }]
keywords = ["architecture", "planning", "code-review", "llm", "agents", "claude"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/IbiliAze/aiarb"

[project.scripts]
aiarb = "aiarb.cli.app:app"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiarb"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Small repos the scan tests read: they are data, not this project's code.
extend-exclude = ["tests/fixtures/repos"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "PT",  # pytest style
    "TC",  # type-checking imports
]

[tool.ruff.lint.flake8-type-checking]
# Dataclass and pydantic annotations are resolved at runtime.
runtime-evaluated-decorators = ["dataclasses.dataclass"]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["aiarb", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["^tests/fixtures/repos/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fixture repos contain their own tests, which are not ours to run.
norecursedirs = ["tests/fixtures", ".*", "*.egg", "build", "dist", "node_modules", ".venv"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
