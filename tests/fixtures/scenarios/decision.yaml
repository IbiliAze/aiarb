# Run with max_rounds: 1. A trade-off the planner and critic cannot settle goes
# to the user. Once decided, nothing is open: settled, exit 0.
agent:
  - schema: PlanDraft
    output: {plan: "# Queue\n\nAdmit users in batches of 500."}
  - schema: Critique
    output:
      objections:
        - claim: Small batches are fairer but make the queue slower.
          type: trade_off
          severity: moderate
          evidence: [{kind: plan, section: Queue}]
  - schema: Responses
    output:
      plan: "# Queue\n\nAdmit users in batches of 500."
      answers: [{id: OBJ-1, response: rebuttal, note: Speed matters more., evidence: [{kind: code, path: src/queue.py}]}]
  - schema: Rulings
    output:
      rulings: [{id: OBJ-1, verdict: reject, note: The business has not said so.}]
  - schema: Explanation
    output:
      summary: The review is over.
      items:
        - {id: OBJ-1, title: Fairness against speed, problem: Small batches are fairer but slower., consequence: Either some users wait longer or the queue is less fair., outcome: "You decided."}
scorer:
  - {call: score, contains: OBJ-1, value: 0.4}
