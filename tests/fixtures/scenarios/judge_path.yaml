# Run with max_rounds: 1. Three objections, one of each type, all rejected.
# At the limit the fact becomes a task, the trade-off goes to the user to
# decide, and the design deadlock goes to the judge. The task is still open:
# settled with open items, exit 1.
agent:
  - schema: PlanDraft
    output: {plan: "# Queue\n\nAdmit users in batches of 500."}
  - schema: Critique
    output:
      objections:
        - claim: The checkout service cannot take 500 users at once.
          type: factual
          severity: major
          evidence: [{kind: code, path: src/checkout.py}]
        - claim: Small batches are fairer but make the queue slower.
          type: trade_off
          severity: moderate
          evidence: [{kind: plan, section: Queue}]
        - claim: The batch size belongs in config, not code.
          type: design
          severity: moderate
          evidence: [{kind: plan, section: Queue}]
  - schema: Responses
    output:
      plan: "# Queue\n\nAdmit users in batches of 500."
      answers:
        - {id: OBJ-1, response: rebuttal, note: It took 800 in the last sale., evidence: [{kind: code, path: src/queue.py}]}
        - {id: OBJ-2, response: rebuttal, note: Speed matters more., evidence: [{kind: code, path: src/queue.py}]}
        - {id: OBJ-3, response: rebuttal, note: It never changes., evidence: [{kind: code, path: src/queue.py}]}
  - schema: Rulings
    output:
      rulings:
        - {id: OBJ-1, verdict: reject, note: That sale had no payment step.}
        - {id: OBJ-2, verdict: reject, note: The business has not said so.}
        - {id: OBJ-3, verdict: reject, note: It will change during a sale.}
  - schema: JudgeRuling
    contains: OBJ-3
    output: {favours: critic, ruling: Read the batch size from config., reason: It changes during a sale.}
  - schema: Explanation
    output:
      summary: The review is over.
      items:
        - {id: OBJ-1, title: Checkout may not take 500 users, problem: Checkout may not cope with 500 users at once., consequence: Checkout could fail at the start of a sale., outcome: "Left as a task: load test checkout first."}
        - {id: OBJ-2, title: Fairness against speed, problem: Small batches are fairer but slower., consequence: Either some users wait longer or the queue is less fair., outcome: "Left for you to decide."}
        - {id: OBJ-3, title: The batch size is hard-coded, problem: Changing the batch size needs a deploy., consequence: Tuning during a sale would be slow., outcome: "The judge ruled for the critic."}
scorer:
  - {call: score, contains: OBJ-1, value: 0.6}
  - {call: score, contains: OBJ-2, value: 0.4}
  - {call: score, contains: OBJ-3, value: 0.3}
  - {call: score, contains: OBJ-1, value: 0.6}
