- schema: Explanation
  output:
    summary: The plan makes the hovered sector on the public stadium map grow about 4% with a short CSS
      transition. It uses a new data-grown attribute set around the code that already moves the hovered
      sector to the front, and it skips sold-out sectors and respects reduced motion. The review raised
      one minor objection, about the grown sector covering its neighbours' edges. It was passed to the
      planner as a note and not debated, so nothing in the plan was changed because of it and nothing
      is blocking.
    items:
    - id: OBJ-1
      title: Grown sector may steal clicks from neighbours
      problem: The hovered sector is drawn on top of its neighbours and grows, so its larger area overlaps
        the edges of adjacent sectors. The plan treats the growth as purely visual and does not consider
        that the overlap also changes where the pointer lands.
      consequence: A buyer pointing at the edge of a neighbouring sector could keep hovering the grown
        one. A click or Enter would then select the wrong sector, and the map could feel sticky along
        shared borders.
      outcome: Rated minor and noted, not debated. The objection suggests testing against the unscaled
        shape, or accepting the overlap explicitly. It also says the 4% figure and the manual checklist
        should cover this case.
