- schema: Explanation
  output:
    summary: The plan adds the scan count to the Scans screen title, for example "Scans (42)". It does
      this by wrapping the whole scaffold in a listener, the same way the Tickets screen does. The title
      stays plain "Scans" when the list is empty. The review raised one minor objection, about the refresh
      test. It was passed to the planner as a note and not debated, so nothing in the plan was changed
      because of it. Nothing is blocking.
    items:
    - id: OBJ-1
      title: Refresh test likely can't trigger a refresh
      problem: The plan's test drags the list down to refresh it and expects the title to change from
        "Scans (1)" to "Scans (2)". With only one or two short rows and default scroll behavior, the list
        can't be pulled down on Android. The pull-to-refresh never fires. The empty state has no scrollable
        list at all. The plan's fallback, calling load() "through a fling", isn't a reliable way to trigger
        it either.
      consequence: The feature itself would work in production. The test would fail, or never prove that
        the title updates when the list changes, so the check meant to catch the body-move regression
        would not do its job.
      outcome: Noted as minor and passed to the planner without debate. The record suggests the test should
        call the view model's load() directly, or the list should use always-scrollable scroll physics.
        The record does not show the plan being revised to do either.
  cost:
    usd: 0.045839
